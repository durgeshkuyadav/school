server:
  port: 8085

spring:
  application:
    name: content-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/school_content}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
